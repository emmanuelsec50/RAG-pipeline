<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vixxon AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0b0e0c;
    --bg-elevated: #141814;
    --panel: #10130f;
    --border: #232823;
    --border-soft: #1a1e1a;
    --text: #e8ede9;
    --text-dim: #838d86;
    --text-faint: #4d554e;
    --accent: #3ee85a;
    --accent-dim: #1f6b2f;
    --accent-wash: rgba(62, 232, 90, 0.08);
    --user-bubble: #1c2a1e;
    --reasoning: #6b756d;
    --error: #e8615d;
    --mono: 'JetBrains Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
    --display: 'Syne', sans-serif;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  [data-theme="light"] {
    --bg: #f3f5f1;
    --bg-elevated: #ffffff;
    --panel: #ffffff;
    --border: #dde2dc;
    --border-soft: #e6ebe3;
    --text: #171a17;
    --text-dim: #666e68;
    --text-faint: #9aa39c;
    --accent: #1f9e3a;
    --accent-dim: #b8ecc3;
    --accent-wash: rgba(31, 158, 58, 0.07);
    --user-bubble: #e3f5e6;
    --reasoning: #7c857e;
    --error: #c73c38;
    --shadow: 0 8px 24px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .shell {
    width: 100%;
    max-width: 760px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- HEADER ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mark {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-weight: 800;
    font-size: 14px;
    color: #051a09;
    flex-shrink: 0;
  }

  .wordmark {
    font-family: var(--display);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.01em;
  }

  .wordmark span {
    color: var(--accent);
  }

  .scanline {
    height: 2px;
    width: 40px;
    margin-left: 36px;
    background: var(--border-soft);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .scanline::after {
    content: '';
    position: absolute;
    top: 0; left: -40%;
    width: 40%;
    height: 100%;
    background: var(--accent);
    opacity: 0;
  }

  .scanline.active::after {
    opacity: 1;
    animation: sweep 1.1s ease-in-out infinite;
  }

  @keyframes sweep {
    0%   { left: -40%; }
    100% { left: 100%; }
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .status-label {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .status-label.live { color: var(--accent); }

  .theme-toggle {
    width: 40px;
    height: 24px;
    border-radius: 12px;
    background: var(--border-soft);
    border: 1px solid var(--border);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }

  .theme-toggle .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    transition: transform 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }

  [data-theme="light"] .theme-toggle .knob {
    transform: translateX(16px);
  }

  /* ---------- THREAD ---------- */
  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-faint);
    max-width: 320px;
  }

  .empty .mark {
    width: 44px;
    height: 44px;
    font-size: 22px;
    border-radius: 12px;
    margin: 0 auto 16px;
  }

  .empty h2 {
    font-family: var(--display);
    font-size: 16px;
    color: var(--text-dim);
    margin: 0 0 6px;
  }

  .empty p {
    font-size: 13px;
    line-height: 1.6;
    margin: 0;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 82%;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg.assistant {
    align-self: flex-start;
    align-items: flex-start;
  }

  .msg .label {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    margin-bottom: 6px;
    padding: 0 4px;
  }

  .bubble {
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 14.5px;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    border: 1px solid var(--accent-dim);
    border-bottom-right-radius: 4px;
  }

  .msg.assistant .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    width: 100%;
  }

  .reasoning-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    padding: 0 0 10px;
    width: 100%;
    text-align: left;
  }

  .reasoning-toggle:hover { color: var(--text-dim); }

  .reasoning-toggle .chev {
    font-size: 8px;
    transition: transform 0.15s;
  }

  .reasoning-toggle.open .chev { transform: rotate(90deg); }

  .reasoning-body {
    display: none;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--reasoning);
    background: var(--accent-wash);
    border-left: 2px solid var(--accent-dim);
    padding: 10px 12px;
    margin-bottom: 12px;
    border-radius: 4px;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
  }

  .reasoning-body.open { display: block; }

  .cursor {
    display: inline-block;
    width: 6px;
    height: 13px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-start infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .error-bubble {
    color: var(--error);
    font-size: 13px;
    background: color-mix(in srgb, var(--error) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--error) 30%, transparent);
    border-radius: 10px;
    padding: 10px 14px;
  }

  /* ---------- INPUT ---------- */
  .input-bar {
    border-top: 1px solid var(--border-soft);
    padding: 14px 22px 20px;
    flex-shrink: 0;
  }

  form {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.15s;
  }

  form:focus-within {
    border-color: var(--accent-dim);
  }

  textarea {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    resize: none;
    height: 22px;
    max-height: 120px;
    line-height: 1.5;
    padding: 6px 0;
  }

  textarea:focus { outline: none; }
  textarea::placeholder { color: var(--text-faint); }

  button {
    background: var(--accent);
    color: #051a09;
    border: none;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }

  button:hover { opacity: 0.88; }
  button:disabled {
    background: var(--border);
    color: var(--text-faint);
    cursor: not-allowed;
  }

  .hint {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    text-align: center;
    margin-top: 10px;
    letter-spacing: 0.02em;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- MOBILE ---------- */
  @media (max-width: 480px) {
    .header {
      padding: 14px 16px;
    }

    .scanline {
      margin-left: 0;
      margin-top: 6px;
    }

    .brand-row { gap: 8px; }

    .wordmark { font-size: 16px; }

    .thread {
      padding: 18px 16px;
    }

    .msg { max-width: 90%; }

    .input-bar {
      padding: 12px 14px calc(16px + env(safe-area-inset-bottom));
    }

    form { padding: 6px 6px 6px 14px; }

    button {
      padding: 10px 16px;
      font-size: 13px;
    }

    /* Prevent iOS auto-zoom on focus: font-size must be >=16px */
    textarea {
      font-size: 16px;
    }

    .theme-toggle {
      width: 44px;
      height: 26px;
    }

    .theme-toggle .knob {
      width: 20px;
      height: 20px;
    }

    [data-theme="light"] .theme-toggle .knob {
      transform: translateX(18px);
    }
  }

  @media (max-width: 360px) {
    .status-label { display: none; }
  }
</style>
</head>
<body data-theme="dark">

<div class="shell">

  <div class="header">
    <div class="brand">
      <div class="brand-row">
        <div class="mark">V</div>
        <div class="wordmark">VIXXON <span>AI</span></div>
      </div>
      <div class="scanline" id="scanline"></div>
    </div>
    <div class="header-controls">
      <span class="status-label" id="statusLabel">IDLE</span>
      <div class="theme-toggle" id="themeToggle" role="button" aria-label="Toggle theme">
        <div class="knob"><span id="knobIcon">☾</span></div>
      </div>
    </div>
  </div>

  <div class="thread" id="thread">
    <div class="empty" id="emptyState">
      <div class="mark">V</div>
      <h2>Ask Vixxon AI anything</h2>
      <p>Grounded in your knowledge base — ask a question to get started.</p>
    </div>
  </div>

  <div class="input-bar">
    <form id="queryForm">
      <textarea id="prompt" placeholder="Message Vixxon AI..." required rows="1"></textarea>
      <button type="submit" id="submitBtn">Send</button>
    </form>
    <div class="hint">Enter to send · Shift + Enter for a new line</div>
  </div>

</div>

<script>
  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('emptyState');
  const form = document.getElementById('queryForm');
  const promptInput = document.getElementById('prompt');
  const submitBtn = document.getElementById('submitBtn');
  const statusLabel = document.getElementById('statusLabel');
  const scanline = document.getElementById('scanline');
  const themeToggle = document.getElementById('themeToggle');
  const knobIcon = document.getElementById('knobIcon');

  // ---------- Theme ----------
  let theme = 'light';
  themeToggle.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', theme);
    knobIcon.textContent = theme === 'dark' ? '☾' : '☀';
  });

  // ---------- Helpers ----------
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? decodeURIComponent(match[2]) : '';
  }

  function autoGrow() {
    promptInput.style.height = '22px';
    promptInput.style.height = Math.min(promptInput.scrollHeight, 120) + 'px';
  }
  promptInput.addEventListener('input', autoGrow);

  function scrollToBottom() {
    thread.scrollTop = thread.scrollHeight;
  }

  function setStreaming(isStreaming) {
    statusLabel.textContent = isStreaming ? 'GENERATING' : 'IDLE';
    statusLabel.classList.toggle('live', isStreaming);
    scanline.classList.toggle('active', isStreaming);
    submitBtn.disabled = isStreaming;
  }

  function addUserMessage(text) {
    const msg = document.createElement('div');
    msg.className = 'msg user';
    msg.innerHTML = `
      <div class="label">You</div>
      <div class="bubble"></div>
    `;
    msg.querySelector('.bubble').textContent = text;
    thread.appendChild(msg);
    scrollToBottom();
  }

  function createAssistantMessage() {
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    msg.innerHTML = `
      <div class="label">Vixxon AI</div>
      <div class="bubble">
        <button type="button" class="reasoning-toggle" style="display:none;">
          <span class="chev">▶</span><span class="r-label">Reasoning</span>
        </button>
        <div class="reasoning-body"></div>
        <div class="answer"></div>
      </div>
    `;
    thread.appendChild(msg);
    scrollToBottom();

    const reasoningToggle = msg.querySelector('.reasoning-toggle');
    const reasoningBody = msg.querySelector('.reasoning-body');
    let reasoningOpen = false;
    let userToggled = false;

    reasoningToggle.addEventListener('click', () => {
      reasoningOpen = !reasoningOpen;
      userToggled = true;
      reasoningToggle.classList.toggle('open', reasoningOpen);
      reasoningBody.classList.toggle('open', reasoningOpen);
    });

    return {
      answerEl: msg.querySelector('.answer'),
      reasoningToggle,
      reasoningBody,
      rLabel: msg.querySelector('.r-label'),
      get userToggled() { return userToggled; }
    };
  }

  // ---------- Submit ----------
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const prompt = promptInput.value.trim();
    if (!prompt) return;

    emptyState.style.display = 'none';
    addUserMessage(prompt);
    promptInput.value = '';
    autoGrow();

    const refs = createAssistantMessage();
    let reasoningChars = 0;
    let answerStarted = false;
    let cursorSpan = document.createElement('span');
    cursorSpan.className = 'cursor';
    refs.answerEl.appendChild(cursorSpan);

    setStreaming(true);

    try {
      const response = await fetch('/api/query/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Requested-With': 'XMLHttpRequest',
          'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ prompt })
      });

      if (!response.ok) throw new Error(`Server responded with ${response.status}`);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);
          if (payload === '[DONE]') continue;

          let parsed;
          try { parsed = JSON.parse(payload); } catch { continue; }

          if (parsed.type === 'reasoning') {
            refs.reasoningToggle.style.display = 'flex';
            reasoningChars += parsed.text.length;
            refs.rLabel.textContent = `Reasoning (${reasoningChars} chars)`;
            refs.reasoningBody.textContent += parsed.text;
            if (!refs.userToggled) refs.reasoningBody.scrollTop = refs.reasoningBody.scrollHeight;
          } else if (parsed.type === 'content') {
            let text = parsed.text;
            if (!answerStarted) {
              text = text.replace(/^\s+/, '');
              if (text.length === 0) continue; // still all whitespace, skip until real content arrives
              answerStarted = true;
            }
            cursorSpan.remove();
            refs.answerEl.append(text);
            refs.answerEl.appendChild(cursorSpan);
            scrollToBottom();
          } else if (parsed.type === 'error') {
            throw new Error(parsed.text || 'Unknown stream error');
          }
        }
      }

      cursorSpan.remove();
      setStreaming(false);

    } catch (err) {
      cursorSpan.remove();
      setStreaming(false);
      statusLabel.textContent = 'ERROR';
      const errBubble = document.createElement('div');
      errBubble.className = 'error-bubble';
      errBubble.textContent = `Something went wrong: ${err.message}. Try again.`;
      refs.answerEl.parentElement.appendChild(errBubble);
    }
  });

  promptInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
</script>

</body>
</html>
