<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vixxon AI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0b0e0c;
    --bg-elevated: #141814;
    --panel: #10130f;
    --border: #232823;
    --border-soft: #1a1e1a;
    --text: #e8ede9;
    --text-dim: #838d86;
    --text-faint: #4d554e;
    --accent: #3ee85a;
    --accent-dim: #1f6b2f;
    --accent-wash: rgba(62, 232, 90, 0.08);
    --user-bubble: #1c2a1e;
    --reasoning: #6b756d;
    --error: #e8615d;
    --mono: 'JetBrains Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
    --display: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- COMPACT HEADER ---------- */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  .mark {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-weight: 800;
    font-size: 11px;
    color: #051a09;
    flex-shrink: 0;
  }

  .wordmark {
    font-family: var(--display);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.01em;
  }
  .wordmark span { color: var(--accent); }

  .scanline {
    height: 2px;
    flex: 1;
    max-width: 30px;
    margin-left: 4px;
    background: var(--border-soft);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .scanline::after {
    content: '';
    position: absolute;
    top: 0; left: -40%;
    width: 40%;
    height: 100%;
    background: var(--accent);
    opacity: 0;
  }
  .scanline.active::after {
    opacity: 1;
    animation: sweep 1.1s ease-in-out infinite;
  }
  @keyframes sweep { 0% { left: -40%; } 100% { left: 100%; } }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
    margin-left: auto;
    flex-shrink: 0;
  }
  .status-dot.live { background: var(--accent); box-shadow: 0 0 5px var(--accent); }

  /* ---------- THREAD ---------- */
  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-faint);
    padding: 0 10px;
  }
  .empty h2 {
    font-family: var(--display);
    font-size: 13.5px;
    color: var(--text-dim);
    margin: 0 0 4px;
  }
  .empty p {
    font-size: 11.5px;
    line-height: 1.5;
    margin: 0 0 14px;
  }

  .suggestions {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .suggestion-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 11.5px;
    text-align: left;
    padding: 8px 11px;
    border-radius: 8px;
    cursor: pointer;
  }
  .suggestion-chip:hover { border-color: var(--accent-dim); color: var(--text); background: var(--accent-wash); }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 88%;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .bubble {
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    border: 1px solid var(--accent-dim);
    border-bottom-right-radius: 3px;
  }
  .msg.assistant .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
    width: 100%;
  }

  .reasoning-toggle {
    display: flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 10px;
    cursor: pointer;
    padding: 0 0 8px;
    width: 100%;
    text-align: left;
  }
  .reasoning-toggle .chev { font-size: 7px; transition: transform 0.15s; }
  .reasoning-toggle.open .chev { transform: rotate(90deg); }

  .reasoning-body {
    display: none;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--reasoning);
    background: var(--accent-wash);
    border-left: 2px solid var(--accent-dim);
    padding: 8px 10px;
    margin-bottom: 10px;
    border-radius: 4px;
    max-height: 160px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .reasoning-body.open { display: block; }

  .answer p { margin: 0 0 8px; }
  .answer p:last-child { margin-bottom: 0; }
  .answer strong { color: var(--text); font-weight: 700; }
  .answer ul, .answer ol { margin: 4px 0 8px; padding-left: 18px; }
  .answer li { margin-bottom: 3px; }
  .answer code {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--accent-wash);
    border: 1px solid var(--border);
    padding: 1px 4px;
    border-radius: 4px;
  }
  .answer a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

  .cursor {
    display: inline-block;
    width: 5px;
    height: 11px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .error-bubble {
    color: var(--error);
    font-size: 11.5px;
    background: rgba(232, 97, 93, 0.08);
    border: 1px solid rgba(232, 97, 93, 0.3);
    border-radius: 8px;
    padding: 8px 11px;
  }

  /* ---------- INPUT ---------- */
  .input-bar {
    border-top: 1px solid var(--border-soft);
    padding: 10px 12px;
    flex-shrink: 0;
  }
  form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 6px 6px 12px;
  }
  form:focus-within { border-color: var(--accent-dim); }
  textarea {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    resize: none;
    height: 20px;
    max-height: 90px;
    line-height: 1.4;
    padding: 5px 0;
  }
  textarea:focus { outline: none; }
  textarea::placeholder { color: var(--text-faint); }

  button[type="submit"] {
    background: var(--accent);
    color: #051a09;
    border: none;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 7px;
    cursor: pointer;
    flex-shrink: 0;
  }
  button[type="submit"]:hover { opacity: 0.88; }
  button[type="submit"]:disabled { background: var(--border); color: var(--text-faint); cursor: not-allowed; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="header">
  <div class="mark">V</div>
  <div class="wordmark">VIXXON <span>AI</span></div>
  <div class="scanline" id="scanline"></div>
  <div class="status-dot" id="statusDot"></div>
</div>

<div class="thread" id="thread">
  <div class="empty" id="emptyState">
    <h2>Ask Vixxon AI</h2>
    <p>Grounded in university guidance — ask a question to get started.</p>
    <div class="suggestions" id="suggestions">
      <button type="button" class="suggestion-chip">How do I apply for HELB?</button>
      <button type="button" class="suggestion-chip">How are exams graded?</button>
    </div>
  </div>
</div>

<div class="input-bar">
  <form id="queryForm">
    <textarea id="prompt" placeholder="Ask a question..." required rows="1"></textarea>
    <button type="submit" id="submitBtn">Send</button>
  </form>
</div>

<script>
  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('emptyState');
  const form = document.getElementById('queryForm');
  const promptInput = document.getElementById('prompt');
  const submitBtn = document.getElementById('submitBtn');
  const scanline = document.getElementById('scanline');
  const statusDot = document.getElementById('statusDot');

  // Fresh chat_id per widget session. Deliberately not persisted
  // (no localStorage/sessionStorage) -- closing and reopening the
  // widget starting a new conversation is an acceptable first-version
  // trade-off; add persistence later if users ask for it.
  const chatId = crypto.randomUUID();

  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? decodeURIComponent(match[2]) : '';
  }

  function autoGrow() {
    promptInput.style.height = '20px';
    promptInput.style.height = Math.min(promptInput.scrollHeight, 90) + 'px';
  }
  promptInput.addEventListener('input', autoGrow);

  function scrollToBottom() { thread.scrollTop = thread.scrollHeight; }

  function setStreaming(isStreaming) {
    statusDot.classList.toggle('live', isStreaming);
    scanline.classList.toggle('active', isStreaming);
    submitBtn.disabled = isStreaming;
  }

  function addUserMessage(text) {
    const msg = document.createElement('div');
    msg.className = 'msg user';
    msg.innerHTML = `<div class="bubble"></div>`;
    msg.querySelector('.bubble').textContent = text;
    thread.appendChild(msg);
    scrollToBottom();
  }

  function createAssistantMessage() {
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    msg.innerHTML = `
      <div class="bubble">
        <button type="button" class="reasoning-toggle" style="display:none;">
          <span class="chev">▶</span><span class="r-label">Reasoning</span>
        </button>
        <div class="reasoning-body"></div>
        <div class="answer"></div>
      </div>
    `;
    thread.appendChild(msg);
    scrollToBottom();

    const reasoningToggle = msg.querySelector('.reasoning-toggle');
    const reasoningBody = msg.querySelector('.reasoning-body');
    let reasoningOpen = false;
    let userToggled = false;

    reasoningToggle.addEventListener('click', () => {
      reasoningOpen = !reasoningOpen;
      userToggled = true;
      reasoningToggle.classList.toggle('open', reasoningOpen);
      reasoningBody.classList.toggle('open', reasoningOpen);
    });

    return {
      answerEl: msg.querySelector('.answer'),
      reasoningToggle,
      reasoningBody,
      rLabel: msg.querySelector('.r-label'),
      get userToggled() { return userToggled; }
    };
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const prompt = promptInput.value.trim();
    if (!prompt) return;

    emptyState.style.display = 'none';
    addUserMessage(prompt);
    promptInput.value = '';
    autoGrow();

    const refs = createAssistantMessage();
    let reasoningChars = 0;
    let answerStarted = false;
    let fullAnswerText = '';
    let cursorSpan = document.createElement('span');
    cursorSpan.className = 'cursor';
    refs.answerEl.appendChild(cursorSpan);

    setStreaming(true);

    try {
      const response = await fetch('/api/query/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Requested-With': 'XMLHttpRequest',
          'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ prompt, chat_id: chatId })
      });

      if (!response.ok) throw new Error(`Server responded with ${response.status}`);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);
          if (payload === '[DONE]') continue;

          let parsed;
          try { parsed = JSON.parse(payload); } catch { continue; }

          if (parsed.type === 'reasoning') {
            refs.reasoningToggle.style.display = 'flex';
            reasoningChars += parsed.text.length;
            refs.rLabel.textContent = `Reasoning (${reasoningChars})`;
            refs.reasoningBody.textContent += parsed.text;
            if (!refs.userToggled) refs.reasoningBody.scrollTop = refs.reasoningBody.scrollHeight;
          } else if (parsed.type === 'content') {
            let text = parsed.text;
            if (!answerStarted) {
              text = text.replace(/^\s+/, '');
              if (text.length === 0) continue;
              answerStarted = true;
            }
            cursorSpan.remove();
            fullAnswerText += text;
            const html = DOMPurify.sanitize(marked.parse(fullAnswerText));
            refs.answerEl.innerHTML = html;
            refs.answerEl.appendChild(cursorSpan);
            scrollToBottom();
          } else if (parsed.type === 'error') {
            throw new Error(parsed.text || 'Unknown stream error');
          }
        }
      }

      cursorSpan.remove();
      setStreaming(false);

    } catch (err) {
      cursorSpan.remove();
      setStreaming(false);
      const errBubble = document.createElement('div');
      errBubble.className = 'error-bubble';
      errBubble.textContent = `Something went wrong: ${err.message}. Try again.`;
      refs.answerEl.parentElement.appendChild(errBubble);
    }
  });

  promptInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  document.querySelectorAll('.suggestion-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      promptInput.value = chip.textContent;
      autoGrow();
      form.requestSubmit();
    });
  });
</script>

</body>
</html>
